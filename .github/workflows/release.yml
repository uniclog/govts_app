name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check release version and render Wails configuration
        shell: pwsh
        run: |
          go run ./cmd/release-version -tag "$env:GITHUB_REF_NAME" -wails-config build/config.yml
          if ($LASTEXITCODE -ne 0) { throw 'release version validation failed' }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      - name: Generate desktop bindings
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28 generate bindings -d cmd/desktop/frontend/bindings -clean=true -ts -i ./cmd/desktop

      - name: Build desktop frontend
        run: |
          npm ci --prefix cmd/desktop/frontend
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build --prefix cmd/desktop/frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }

      - name: Build Windows desktop client
        run: |
          New-Item -ItemType Directory -Force dist, build/windows | Out-Null
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28 generate icons -input cmd/desktop/frontend/src/components/logo.png -windowsfilename build/windows/icon.ico -macfilename build/windows/icon.icns
          if ($LASTEXITCODE -ne 0) { throw 'icon generation failed' }
          Remove-Item -Force build/windows/icon.icns -ErrorAction SilentlyContinue
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out cmd/desktop/rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'windows resource generation failed' }
          go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o dist/SRX64.exe ./cmd/desktop
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }

      - name: Build Linux server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-w -s" -o dist/sonoryx-server-linux-amd64 ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }

      - name: Sign desktop update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          go run ./cmd/update-sign -binary dist/SRX64.exe -public-key cmd/desktop/update-public-key.txt -out dist/SRX64.exe.signature -packed dist/SRX64.exe.zst -legacy-out dist/signature
          if ($LASTEXITCODE -ne 0) { throw 'update signing failed' }
          # Clients released before the Sonoryx rename update from GTS64.exe + signature.
          Copy-Item dist/SRX64.exe dist/GTS64.exe
          $sums = foreach ($name in 'SRX64.exe', 'SRX64.exe.zst', 'GTS64.exe') {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "Release $tag is already published" }
          } else {
            gh release create $tag --title $tag --draft --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'release creation failed' }
          }
          gh release upload $tag dist/SRX64.exe dist/SRX64.exe.zst dist/SRX64.exe.signature dist/GTS64.exe dist/signature dist/sonoryx-server-linux-amd64 dist/SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release asset upload failed' }
          gh release edit $tag --title $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'release publication failed' }
