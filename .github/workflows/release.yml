name: Release

on:
  push:
    tags:
      - 'v*'

# Jobs get only what they need: build and build-macos read the source, sign
# alone sees the update signing key, publish alone may write the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check release version and render Wails configuration
        shell: pwsh
        run: |
          go run ./cmd/release-version -tag "$env:GITHUB_REF_NAME" -wails-config build/config.yml
          if ($LASTEXITCODE -ne 0) { throw 'release version validation failed' }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      - name: Generate desktop bindings
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 generate bindings -d cmd/desktop/frontend/bindings -clean=true -ts -i ./cmd/desktop

      - name: Build desktop frontend
        run: |
          # No dependency needs an install script (only the macOS-only fsevents has one).
          npm ci --ignore-scripts --prefix cmd/desktop/frontend
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build --prefix cmd/desktop/frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }

      - name: Build Windows desktop client
        run: |
          New-Item -ItemType Directory -Force dist, build/windows | Out-Null
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 generate icons -input cmd/desktop/frontend/src/components/logo.png -windowsfilename build/windows/icon.ico -macfilename build/windows/icon.icns
          if ($LASTEXITCODE -ne 0) { throw 'icon generation failed' }
          Remove-Item -Force build/windows/icon.icns -ErrorAction SilentlyContinue
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out cmd/desktop/rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'windows resource generation failed' }
          go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o dist/SRX64.exe ./cmd/desktop
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }

      - name: Build Linux server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-w -s" -o dist/sonoryx-server-linux-amd64 ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }

      - name: Upload unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: |
            dist/SRX64.exe
            dist/sonoryx-server-linux-amd64
          if-no-files-found: error
          retention-days: 1

  build-macos:
    # Universal (Apple Silicon + Intel) Sonoryx.app, zipped for download and
    # for the in-app updater. Signed for updates in the sign job like the EXE;
    # the bundle itself is ad-hoc code signed (no Apple Developer ID).
    runs-on: macos-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check release version
        run: go run ./cmd/release-version -tag "$GITHUB_REF_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      - name: Generate desktop bindings
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 generate bindings -d cmd/desktop/frontend/bindings -clean=true -ts -i ./cmd/desktop

      - name: Build desktop frontend
        run: |
          npm ci --ignore-scripts --prefix cmd/desktop/frontend
          npm run build --prefix cmd/desktop/frontend

      - name: Build macOS desktop client
        run: |
          mkdir -p build/darwin dist
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 generate icons -input cmd/desktop/frontend/src/components/logo.png -windowsfilename build/darwin/icon.ico -macfilename build/darwin/icon.icns
          rm -f build/darwin/icon.ico
          # Builds rnnoise from the pinned xiph release, both architectures,
          # lipo, Sonoryx.app, Sonoryx-macos.zip and Sonoryx-macos.dmg.
          sh scripts/build-macos-app.sh --release
          mv bin/Sonoryx-macos.zip bin/Sonoryx-macos.dmg dist/

      - name: Upload unsigned macOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos
          path: |
            dist/Sonoryx-macos.zip
            dist/Sonoryx-macos.dmg
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [build, build-macos]
    runs-on: windows-latest
    # The release environment holds UPDATE_SIGNING_KEY; its protection rules
    # (required reviewers, tag filter) gate every use of the key.
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No shared cache: the job with the key must not restore state other
          # jobs wrote.
          cache: false

      - name: Download unsigned build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist

      - name: Download unsigned macOS build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos
          path: dist

      - name: Sign desktop update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          go run ./cmd/update-sign -binary dist/SRX64.exe -public-key cmd/desktop/update-public-key.txt -out dist/SRX64.exe.signature -packed dist/SRX64.exe.zst -legacy-out dist/signature -macos-archive dist/Sonoryx-macos.zip -macos-out dist/Sonoryx-macos.zip.signature
          if ($LASTEXITCODE -ne 0) { throw 'update signing failed' }
          # Clients released before the Sonoryx rename update from GTS64.exe + signature.
          Copy-Item dist/SRX64.exe dist/GTS64.exe
          $sums = foreach ($name in 'SRX64.exe', 'SRX64.exe.zst', 'GTS64.exe', 'Sonoryx-macos.zip', 'Sonoryx-macos.dmg') {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS

      - name: Upload signed release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "Release $tag is already published" }
          } else {
            gh release create $tag --title $tag --draft --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'release creation failed' }
          }
          gh release upload $tag dist/SRX64.exe dist/SRX64.exe.zst dist/SRX64.exe.signature dist/GTS64.exe dist/signature dist/Sonoryx-macos.zip dist/Sonoryx-macos.zip.signature dist/Sonoryx-macos.dmg dist/sonoryx-server-linux-amd64 dist/SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release asset upload failed' }
          gh release edit $tag --title $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'release publication failed' }
