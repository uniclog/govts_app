version: '3'

vars:
  APP_NAME: Sonoryx
  # Keep the executable name stable. Wails may override APP_NAME with a
  # display name containing the application version.
  BINARY_NAME: Sonoryx
  FRONTEND_DIR: cmd/desktop/frontend
  WAILS_VERSION: v3.0.0-beta.28
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  version:prepare:
    internal: true
    cmds:
      - go run ./cmd/release-version -wails-config build/config.yml

  bindings:
    desc: Generate type-safe Wails bindings for the desktop service
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}} generate bindings -d {{.FRONTEND_DIR}}/bindings -clean=true -ts -i ./cmd/desktop

  frontend:install:
    dir: '{{.FRONTEND_DIR}}'
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/**/*
    cmds:
      - npm install

  frontend:build:
    dir: '{{.FRONTEND_DIR}}'
    deps: [frontend:install, bindings]
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}

  frontend:dev:
    dir: '{{.FRONTEND_DIR}}'
    deps: [frontend:install]
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  windows:resources:
    internal: true
    platforms: [windows]
    cmds:
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path build/windows | Out-Null"
      - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}} generate icons -input cmd/desktop/frontend/src/components/logo.png -windowsfilename build/windows/icon.ico -macfilename build/windows/icon.icns
      - cmd: powershell -NoProfile -Command "Remove-Item -Force build/windows/icon.icns -ErrorAction SilentlyContinue"
      - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}} generate syso -arch {{ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out cmd/desktop/rsrc_windows_{{ARCH}}.syso

  build:dev:
    desc: Build the desktop backend for Wails development mode
    deps: [bindings, version:prepare]
    cmds:
      - task: windows:resources
      # Keep the Vite-backed development executable separate from the
      # standalone application. It only contains the fallback page and must
      # not be mistaken for a distributable build.
      - cmd: go build -buildvcs=false -gcflags=all="-l" -o bin/{{.BINARY_NAME}}-dev.exe ./cmd/desktop
        platforms: [windows]
      - cmd: go build -buildvcs=false -gcflags=all="-l" -o bin/{{.BINARY_NAME}}-dev ./cmd/desktop
        platforms: [linux, darwin]

  build:
    desc: Build the Wails desktop client
    deps: [frontend:build, version:prepare]
    cmds:
      - task: windows:resources
      - cmd: go build {{if ne .DEV "true"}}-tags production -trimpath -ldflags="-w -s -H windowsgui"{{else}}-buildvcs=false -gcflags=all="-l"{{end}} -o bin/{{.BINARY_NAME}}.exe ./cmd/desktop
        platforms: [windows]
      - cmd: go build {{if ne .DEV "true"}}-tags production -trimpath -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}} -o bin/{{.BINARY_NAME}} ./cmd/desktop
        platforms: [linux, darwin]

  run:
    cmds:
      - cmd: bin/{{.BINARY_NAME}}.exe
        platforms: [windows]
      - cmd: ./bin/{{.BINARY_NAME}}
        platforms: [linux, darwin]

  run:dev:
    internal: true
    cmds:
      - cmd: bin/{{.BINARY_NAME}}-dev.exe
        platforms: [windows]
      - cmd: ./bin/{{.BINARY_NAME}}-dev
        platforms: [linux, darwin]

  dev:
    desc: Run the desktop client with Wails/Vite hot reload
    deps: [version:prepare]
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}} dev -config ./build/config.generated.yml -port {{.VITE_PORT}}
